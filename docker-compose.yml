services:
  postgres:
    image: postgres:16
    container_name: clini-flow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: clini_flow
      POSTGRES_PASSWORD: clini_flow_dev
      POSTGRES_DB: clini_flow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: